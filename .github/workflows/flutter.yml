name: Flutter checks
on:
  push:
    branches: [main, feat/flutter-foundation]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --dart-define-from-file=config/project.json
      - uses: actions/upload-artifact@v4
        with:
          name: firststop-web
          path: build/web
          retention-days: 3
